description: two pops of size 10000 split from a single ancestor at 10000 generations; migration explicitly set to zero
time_units: generations

demes:
  # Ancestral deme
  - name: root
    epochs:
      - start_size: 8888
        end_time: 10000

  - name: pop0
    ancestors: [root]
    epochs:
      - start_size: 87000
        end_time: 0

  - name: pop1
    ancestors: [root]
    epochs:
      - start_size: 6666
        end_time: 0

migrations:
  - demes: [pop0, pop1]
    rate: 0.0